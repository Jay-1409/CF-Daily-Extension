<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CF-Daily</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <main id="popupWindow">
        <header id="icon">
            <img src="../icons/icon48.png" alt="CF-Daily logo">
            <div>
                <h1>CF-Daily</h1>
                <p>One problem. Your rating.</p>
            </div>
        </header>

        <label for="ratingSelect">Problem rating</label>
        <select id="ratingSelect" aria-label="Select a Codeforces problem rating"></select>

        <section id="output" aria-live="polite">
            <p class="status">Loading today's problem…</p>
        </section>

        <p id="userNote"></p>

        <footer>
            Developed by
            <a href="https://codeforces.com/profile/OneShhhhhh" target="_blank">Vansh Sukhija</a>
            ·
            <a href="https://www.linkedin.com/in/vansh-sukhija-b50031229/" target="_blank">LinkedIn</a>
        </footer>
    </main>

    <script src="./potd.js"></script>
    <script src="./popup.js"></script>
</body>

</html>
