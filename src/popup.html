<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CF-Daily</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <main id="popupWindow">
        <header class="app-header">
            <div class="brand-mark">
                <img src="../icons/icon48.png" alt="">
            </div>
            <div class="brand-copy">
                <h1>CF-Daily</h1>
                <p>One focused problem, every day.</p>
            </div>
            <span class="daily-badge">Daily</span>
        </header>

        <section class="rating-control" aria-labelledby="ratingLabel">
            <div class="field-heading">
                <label id="ratingLabel" for="ratingSelect">Choose your rating</label>
                <span id="ratingHint">800–3500</span>
            </div>
            <div class="select-wrap">
                <select id="ratingSelect" aria-describedby="ratingHint"></select>
            </div>
        </section>

        <section id="output" class="challenge-card" aria-live="polite" aria-busy="true">
            <div class="loading-state">
                <span class="spinner" aria-hidden="true"></span>
                <p class="status">Loading today’s problem…</p>
            </div>
        </section>

        <section id="accountPanel" class="account-panel" aria-live="polite">
            <button id="signInButton" class="google-button" type="button">
                <span class="google-mark" aria-hidden="true">G</span>
                Sign in with Google
            </button>
            <div id="accountContent" hidden>
                <div class="account-header">
                    <img id="accountAvatar" alt="">
                    <div>
                        <strong id="accountName"></strong>
                        <span id="accountEmail"></span>
                    </div>
                    <button id="signOutButton" class="text-button" type="button">Sign out</button>
                </div>
                <div class="streak-stats">
                    <div><strong id="currentStreak">0</strong><span>Current streak</span></div>
                    <div><strong id="longestStreak">0</strong><span>Best streak</span></div>
                </div>
                <details class="leaderboard">
                    <summary>Top streaks</summary>
                    <ol id="leaderboardList"></ol>
                </details>
            </div>
            <p id="cloudStatus"></p>
        </section>

        <footer class="privacy-note">
            <span class="status-dot" aria-hidden="true"></span>
            <p id="userNote"></p>
        </footer>
    </main>

    <script src="./config.js"></script>
    <script src="./potd.js"></script>
    <script src="./cloud.js"></script>
    <script src="./popup.js"></script>
</body>

</html>
